name: Build Aurin Release

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Immutable Aurin source tag or commit"
        required: true
        type: string
      release_tag:
        description: "Public release tag, for example v0.1.23"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.release_tag }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CDITOR_REV: cd29143570cdf5b0b49d1a4db51b2877a9c6b9c0
  COMET_REV: c7ac33ccc961588eabeef21a65d605751bc3f2d6
  GPUI_COMPONENT_REV: bbda72579c940d71a432a8eb963b15ebcd4f997a
  GPUI_REV: 349cb520b79ec1a9838f9389b9f86557ef3767dd
  RELEASE_TAG: ${{ inputs.release_tag }}

jobs:
  prepare-release:
    name: Prepare Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate inputs
        shell: bash
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          [[ "${SOURCE_REF}" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]{0,127}$ ]]
          [[ "${SOURCE_REF}" != *..* ]]
          [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]]

      - name: Create public release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --title "Aurin ${RELEASE_TAG}" \
              --notes "Aurin desktop installers and SHA-256 checksums."
          fi

  build-macos-arm64:
    name: macOS Apple Silicon
    needs: prepare-release
    runs-on: macos-14
    timeout-minutes: 120
    env:
      RUSTFLAGS: "-C target-cpu=apple-m1"
    steps:
      - name: Check out private Aurin source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: JYChen-8866/Aurin
          ref: ${{ inputs.source_ref }}
          path: Aurin
          ssh-key: ${{ secrets.AURIN_DEPLOY_KEY }}
          persist-credentials: false

      - name: Check out Cditor
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: JYChen-8866/Cditor
          ref: ${{ env.CDITOR_REV }}
          path: CDitor-V2
          persist-credentials: false

      - name: Check out GPUI mobile fork
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: JYChen-8866/zed
          ref: ${{ env.GPUI_REV }}
          path: zed-gpui-mobile
          persist-credentials: false

      - name: Check out gpui-component
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: JYChen-8866/gpui-component
          ref: ${{ env.GPUI_COMPONENT_REV }}
          path: gpui-component-main/gpui-component-main
          persist-credentials: false

      - name: Check out comet
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: JYChen-8866/comet
          ref: ${{ env.COMET_REV }}
          path: comet-main
          persist-credentials: false

      - name: Reclaim runner disk space
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          selected_xcode="$(cd "$(dirname "$(dirname "$(xcode-select -p)")")" && pwd -P)"
          for candidate in /Applications/Xcode*.app; do
            if [[ ! -e "${candidate}" ]]; then
              sudo rm -f "${candidate}"
              continue
            fi
            candidate_path="$(cd "${candidate}" && pwd -P)"
            if [[ "${candidate_path}" != "${selected_xcode}" ]]; then
              sudo rm -rf "${candidate}"
            fi
          done
          sudo rm -rf /Library/Developer/CoreSimulator/Profiles/Runtimes
          sudo rm -rf /usr/local/lib/android /usr/local/share/powershell
          sudo rm -rf /Users/runner/Library/Android/sdk /opt/hostedtoolcache/CodeQL
          sudo rm -rf "${RUNNER_TOOL_CACHE}" 2>/dev/null || true
          rm -rf "$HOME/.cargo/registry" "$HOME/.cargo/git" 2>/dev/null || true
          rm -rf "$HOME/.npm" "$HOME/.cache/pip" "$HOME/.cache/go-build" 2>/dev/null || true
          rm -rf "$HOME/Library/Developer/Xcode/DerivedData" 2>/dev/null || true

      - name: Install Rust target
        run: rustup target add aarch64-apple-darwin

      - name: Restore cargo build cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            Aurin/target
          key: aurin-cargo-${{ runner.os }}-${{ hashFiles('Aurin/Cargo.lock') }}-${{ env.CDITOR_REV }}-${{ env.COMET_REV }}-${{ env.GPUI_COMPONENT_REV }}-${{ env.GPUI_REV }}
          restore-keys: |
            aurin-cargo-${{ runner.os }}-${{ hashFiles('Aurin/Cargo.lock') }}-
            aurin-cargo-${{ runner.os }}-

      - name: Verify release profile
        working-directory: Aurin
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'opt-level = 3' Cargo.toml
          grep -Fq 'lto = "fat"' Cargo.toml
          grep -Fq 'codegen-units = 1' Cargo.toml
          grep -Fq 'strip = "symbols"' Cargo.toml
          grep -Fq 'panic = "abort"' Cargo.toml

      - name: Build private source
        working-directory: Aurin
        shell: bash
        env:
          AURIN_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -eo pipefail
          cargo build --locked --release --target aarch64-apple-darwin \
            -p aurin-desktop -p aurin-update-helper 2>&1 | tee "${RUNNER_TEMP}/aurin-build.log"

      - name: Save cargo build cache
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            Aurin/target
          key: aurin-cargo-${{ runner.os }}-${{ hashFiles('Aurin/Cargo.lock') }}-${{ env.CDITOR_REV }}-${{ env.COMET_REV }}-${{ env.GPUI_COMPONENT_REV }}-${{ env.GPUI_REV }}-${{ github.run_id }}

      - name: Package DMG
        working-directory: Aurin
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          binary="target/aarch64-apple-darwin/release/aurin-desktop"
          helper="target/aarch64-apple-darwin/release/aurin-update-helper"
          artifact="aurin-desktop-v${version}-macos-arm64.dmg"
          update_archive="aurin-desktop-v${version}-macos-arm64.zip"
          app="dist/Aurin.app"
          contents="${app}/Contents"
          dmg_root="dist/dmg-root"

          test -x "${binary}"
          test -f "assets/Aurin.icns"
          mkdir -p "${contents}/MacOS" "${contents}/Helpers" "${contents}/Resources" "${dmg_root}"
          install -m 755 "${binary}" "${contents}/MacOS/Aurin"
          install -m 755 "${helper}" "${contents}/Helpers/aurin-update-helper"
          install -m 644 "assets/Aurin.icns" "${contents}/Resources/Aurin.icns"

          /usr/libexec/PlistBuddy -c 'Add :CFBundleDisplayName string Aurin' "${contents}/Info.plist"
          /usr/libexec/PlistBuddy -c 'Add :CFBundleExecutable string Aurin' "${contents}/Info.plist"
          /usr/libexec/PlistBuddy -c 'Add :CFBundleIconFile string Aurin.icns' "${contents}/Info.plist"
          /usr/libexec/PlistBuddy -c 'Add :CFBundleIdentifier string io.github.jychen8866.aurin' "${contents}/Info.plist"
          /usr/libexec/PlistBuddy -c 'Add :CFBundleInfoDictionaryVersion string 6.0' "${contents}/Info.plist"
          /usr/libexec/PlistBuddy -c 'Add :CFBundleName string Aurin' "${contents}/Info.plist"
          /usr/libexec/PlistBuddy -c 'Add :CFBundlePackageType string APPL' "${contents}/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string ${version}" "${contents}/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string ${version}" "${contents}/Info.plist"
          /usr/libexec/PlistBuddy -c 'Add :LSApplicationCategoryType string public.app-category.productivity' "${contents}/Info.plist"
          /usr/libexec/PlistBuddy -c 'Add :LSMinimumSystemVersion string 13.0' "${contents}/Info.plist"
          /usr/libexec/PlistBuddy -c 'Add :NSHighResolutionCapable bool true' "${contents}/Info.plist"
          /usr/libexec/PlistBuddy -c 'Add :CFBundleDocumentTypes array' "${contents}/Info.plist"
          /usr/libexec/PlistBuddy -c 'Add :CFBundleDocumentTypes:0 dict' "${contents}/Info.plist"
          /usr/libexec/PlistBuddy -c 'Add :CFBundleDocumentTypes:0:CFBundleTypeName string Markdown Document' "${contents}/Info.plist"
          /usr/libexec/PlistBuddy -c 'Add :CFBundleDocumentTypes:0:CFBundleTypeRole string Editor' "${contents}/Info.plist"
          /usr/libexec/PlistBuddy -c 'Add :CFBundleDocumentTypes:0:LSHandlerRank string Alternate' "${contents}/Info.plist"
          /usr/libexec/PlistBuddy -c 'Add :CFBundleDocumentTypes:0:LSItemContentTypes array' "${contents}/Info.plist"
          /usr/libexec/PlistBuddy -c 'Add :CFBundleDocumentTypes:0:LSItemContentTypes:0 string net.daringfireball.markdown' "${contents}/Info.plist"
          /usr/libexec/PlistBuddy -c 'Add :CFBundleDocumentTypes:0:CFBundleTypeExtensions array' "${contents}/Info.plist"
          /usr/libexec/PlistBuddy -c 'Add :CFBundleDocumentTypes:0:CFBundleTypeExtensions:0 string md' "${contents}/Info.plist"
          /usr/libexec/PlistBuddy -c 'Add :CFBundleDocumentTypes:0:CFBundleTypeExtensions:1 string markdown' "${contents}/Info.plist"
          /usr/libexec/PlistBuddy -c 'Add :CFBundleDocumentTypes:0:CFBundleTypeExtensions:2 string mdown' "${contents}/Info.plist"
          /usr/libexec/PlistBuddy -c 'Add :CFBundleDocumentTypes:0:CFBundleTypeExtensions:3 string mkd' "${contents}/Info.plist"

          plutil -lint "${contents}/Info.plist" >/dev/null
          codesign --force --deep --sign - "${app}" >/dev/null
          codesign --verify --deep --strict "${app}"
          ditto -c -k --keepParent "${app}" "dist/${update_archive}"
          shasum -a 256 "dist/${update_archive}" > "dist/${update_archive}.sha256"
          ditto "${app}" "${dmg_root}/Aurin.app"
          rm -rf target "${app}"
          ln -s /Applications "${dmg_root}/Applications"
          hdiutil create -quiet -volname Aurin -srcfolder "${dmg_root}" -format UDZO "dist/${artifact}"
          shasum -a 256 "dist/${artifact}" > "dist/${artifact}.sha256"

      - name: Upload macOS build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Aurin-macOS-arm64
          path: |
            Aurin/dist/*.dmg
            Aurin/dist/*.zip
            Aurin/dist/*.sha256
          if-no-files-found: error

      - name: Publish DMG
        working-directory: Aurin
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "${RELEASE_TAG}" dist/*.dmg dist/*.zip dist/*.sha256 \
            --repo "${GITHUB_REPOSITORY}" --clobber

  build-windows-x64:
    name: Windows x64
    needs: prepare-release
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      RUSTFLAGS: "-C target-cpu=x86-64-v3"
    steps:
      - name: Check out private Aurin source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: JYChen-8866/Aurin
          ref: ${{ inputs.source_ref }}
          path: Aurin
          ssh-key: ${{ secrets.AURIN_DEPLOY_KEY }}
          persist-credentials: false

      - name: Check out Cditor
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: JYChen-8866/Cditor
          ref: ${{ env.CDITOR_REV }}
          path: CDitor-V2
          persist-credentials: false

      - name: Check out GPUI mobile fork
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: JYChen-8866/zed
          ref: ${{ env.GPUI_REV }}
          path: zed-gpui-mobile
          persist-credentials: false

      - name: Check out gpui-component
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: JYChen-8866/gpui-component
          ref: ${{ env.GPUI_COMPONENT_REV }}
          path: gpui-component-main/gpui-component-main
          persist-credentials: false

      - name: Check out comet
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: JYChen-8866/comet
          ref: ${{ env.COMET_REV }}
          path: comet-main
          persist-credentials: false

      - name: Free disk space before build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'SilentlyContinue'
          $paths = @(
            'C:\Program Files\Android',
            'C:\Program Files (x86)\Android',
            'C:\Program Files\dotnet',
            'C:\Program Files\Go',
            'C:\Program Files\Java',
            'C:\Program Files\jdk-*',
            'C:\Program Files\Microsoft SQL Server',
            'C:\Program Files\nodejs',
            'C:\Program Files\Python*',
            'C:\Program Files\Ruby*',
            "$env:LOCALAPPDATA\Android",
            "$env:LOCALAPPDATA\Microsoft\vcpkg",
            'C:\vcpkg'
          )
          foreach ($path in $paths) {
            Remove-Item $path -Recurse -Force -ErrorAction SilentlyContinue
          }
          Remove-Item "$env:USERPROFILE\.cargo\registry" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "$env:USERPROFILE\.cargo\git" -Recurse -Force -ErrorAction SilentlyContinue

      - name: Install Rust target
        shell: pwsh
        run: rustup target add x86_64-pc-windows-msvc

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --no-progress -y

      - name: Restore cargo build cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            Aurin/target
          key: aurin-cargo-${{ runner.os }}-${{ hashFiles('Aurin/Cargo.lock') }}-${{ env.CDITOR_REV }}-${{ env.COMET_REV }}-${{ env.GPUI_COMPONENT_REV }}-${{ env.GPUI_REV }}
          restore-keys: |
            aurin-cargo-${{ runner.os }}-${{ hashFiles('Aurin/Cargo.lock') }}-
            aurin-cargo-${{ runner.os }}-

      - name: Verify release profile
        working-directory: Aurin
        shell: pwsh
        run: |
          $content = Get-Content Cargo.toml -Raw
          @('opt-level = 3', 'lto = "fat"', 'codegen-units = 1', 'strip = "symbols"', 'panic = "abort"') |
            ForEach-Object { if (-not $content.Contains($_)) { throw 'Invalid release profile' } }

      - name: Build private source
        working-directory: Aurin
        shell: pwsh
        env:
          AURIN_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $stdoutLog = Join-Path $env:RUNNER_TEMP 'aurin-build.stdout.log'
          $stderrLog = Join-Path $env:RUNNER_TEMP 'aurin-build.stderr.log'
          $process = Start-Process -FilePath (Get-Command cargo).Source `
            -ArgumentList @('build', '--locked', '--release', '--target', 'x86_64-pc-windows-msvc', '-p', 'aurin-desktop') `
            -RedirectStandardOutput $stdoutLog -RedirectStandardError $stderrLog -NoNewWindow -PassThru
          while (-not $process.WaitForExit(60000)) {
            Write-Host 'Aurin Windows build is still running; compiler output remains private.'
          }
          $process.WaitForExit()
          if ($process.ExitCode -ne 0) {
            Write-Host 'Aurin Windows build failed. Compiler output tail:'
            if (Test-Path $stderrLog) { Get-Content $stderrLog -Tail 100 }
            if (Test-Path $stdoutLog) { Get-Content $stdoutLog -Tail 100 }
            Get-PSDrive C | Select-Object Used,Free
            Write-Error 'Aurin build failed. Compiler output is suppressed because this is a public workflow.'
            exit 1
          }
          Remove-Item $stdoutLog, $stderrLog -Force

      - name: Save cargo build cache
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            Aurin/target
          key: aurin-cargo-${{ runner.os }}-${{ hashFiles('Aurin/Cargo.lock') }}-${{ env.CDITOR_REV }}-${{ env.COMET_REV }}-${{ env.GPUI_COMPONENT_REV }}-${{ env.GPUI_REV }}-${{ github.run_id }}

      - name: Package portable EXE and installer
        working-directory: Aurin
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:RELEASE_TAG.TrimStart('v')
          $source = 'target/x86_64-pc-windows-msvc/release/aurin-desktop.exe'
          $artifact = "aurin-desktop-v$version-windows-x64.exe"
          $installer = "aurin-desktop-v$version-windows-x64-setup.exe"
          $productVersion = "$(($version -split '-')[0]).0"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item $source "dist/$artifact"
          $sourcePath = (Resolve-Path $source).Path
          $installerPath = (Join-Path (Resolve-Path dist).Path $installer)
          $makensis = Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe'
          $nsiPath = (Resolve-Path 'packaging/windows/Aurin.nsi').Path
          & $makensis "/DVERSION=$version" "/DPRODUCT_VERSION=$productVersion" "/DSOURCE_EXE=$sourcePath" "/DOUT_FILE=$installerPath" $nsiPath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $hash = (Get-FileHash "dist/$artifact" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $artifact" | Set-Content -NoNewline "dist/$artifact.sha256"
          $installerHash = (Get-FileHash "dist/$installer" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$installerHash  $installer" | Set-Content -NoNewline "dist/$installer.sha256"

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Aurin-Windows-x64
          path: |
            Aurin/dist/*.exe
            Aurin/dist/*.sha256
          if-no-files-found: error

      - name: Publish EXE
        working-directory: Aurin
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload $env:RELEASE_TAG (Get-ChildItem dist/*.exe).FullName (Get-ChildItem dist/*.exe.sha256).FullName `
            --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  publish-checksums:
    name: Publish Combined Checksums
    needs: [build-macos-arm64, build-windows-x64]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          path: release
          merge-multiple: true

      - name: Generate checksum manifest
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          cd release
          sha256sum "aurin-desktop-v${version}-macos-arm64.dmg" > SHA256SUMS.txt
          sha256sum "aurin-desktop-v${version}-macos-arm64.zip" >> SHA256SUMS.txt
          sha256sum "aurin-desktop-v${version}-windows-x64.exe" >> SHA256SUMS.txt
          sha256sum "aurin-desktop-v${version}-windows-x64-setup.exe" >> SHA256SUMS.txt

      - name: Publish checksum manifest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "${RELEASE_TAG}" release/SHA256SUMS.txt \
            --repo "${GITHUB_REPOSITORY}" --clobber
